
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geo Urban LP - Plataforma de Desarrollo Inmobiliario">
    <title>Geo Urban LP | Iniciar sesión</title>

    <!-- Favicon -->
    <link rel="icon" href="frontend/assets/icons/geourbanlp-light-icon.svg" type="image/svg+xml">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="login">
        <section class="login-brand">
            <div class="login-brand-content">
                <div class="login-logo">
                    <img
                        src="frontend/assets/icons/geourbanlp-dark-logo.svg"
                        alt=""
                        aria-hidden="true"
                        class="login-logo-image login-logo-dark">
                </div>
                <div class="login-brand-description">
                    <h1>Territorio, ciudad e información.</h1>
                    <p>
                        Una plataforma GIS para la planificación,
                        análisis y desarrollo inmobiliario.
                    </p>
                </div>
            </div>
        </section>
        <section class="login-access">
            <div class="login-theme">
                <label for="select-theme">
                    Apariencia
                </label>
                <select id="select-theme" aria-label="Seleccionar apariencia">
                    <option value="system">Sistema</option>
                    <option value="light">Claro</option>
                    <option value="dark">Oscuro</option>
                </select>
            </div>
            <div class="login-access-content">
                <div class="login-access-header">
                    <span class="login-access-label">
                        PLATAFORMA GIS
                    </span>
                    <h2>Bienvenido a Geo Urban LP</h2>
                    <p>
                        Accede al entorno integrado de gestión territorial
                        y desarrollo inmobiliario.
                    </p>
                </div>
                <button id="btn-ingresar" class="btn-login" type="button">
                    <span>Ingresar a Geo Urban LP</span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                            d="M5 12H19 M14 7L19 12L14 17"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="login-access-footer">
                    Geo Urban LP · Plataforma GIS Inmobiliaria
                </div>
            </div>
        </section>
    </main>
    <!-- Scripts -->
    <script src="index.js"></script>

</body>
</html>
