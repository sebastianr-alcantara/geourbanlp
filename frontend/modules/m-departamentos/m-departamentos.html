<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Módulo de consulta de departamentos de Geo Urban LP">
    <title>Geo Urban LP | Departamentos</title>
    <link rel="icon" href="../../assets/icons/geourbanlp-light-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="../../shared/css/styles.css">
    <link rel="stylesheet" href="../../shared/css/basic.css">
    <link rel="stylesheet" href="m-departamentos.css">
</head>
<body>
    <div class="departments-page">
        <header class="departments-header">
            <a class="departments-brand" href="../modules.html" aria-label="Geo Urban LP">
                <img src="../../assets/icons/geourbanlp-light-logo.svg" alt="Geo Urban LP" class="departments-logo departments-logo-light">
                <img src="../../assets/icons/geourbanlp-dark-logo.svg" alt="" aria-hidden="true" class="departments-logo departments-logo-dark">
            </a>
            <div class="departments-title">
                <span>GEOVISOR</span>
                <strong>Departamentos</strong>
            </div>
            <div class="user-welcome" aria-label="Usuario actual">
                <span class="material-icons" aria-hidden="true">account_circle</span>
                <strong data-demo-user-name>SEBASTIÁN ROMALDO ALCÁNTARA LUYO</strong>
            </div>
            <a class="departments-back" href="../modules.html" aria-label="Volver a Módulos">
                <span class="material-icons" aria-hidden="true">logout</span>
                <span>Volver a Módulos</span>
            </a>
        </header>
        <main class="departments-main">
            <section class="departments-placeholder">
                <span class="material-icons" aria-hidden="true">map</span>
                <h1>Departamentos</h1>
                <p>Este módulo está en preparación.</p>
            </section>
        </main>
    </div>
    <script src="../../shared/js/demo-profile.js"></script>
</body>
</html>
